services:
  - type: web
    name: tradepulse-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: tradepulse
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
